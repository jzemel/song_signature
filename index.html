<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phish Jam How Long?</title>
    <meta property="og:image" content="images/screenshot.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/phishicon.jpg" type="images/x-icon">
</head>
<body>
    <div id="controls">
        <h1>When did Phish play that song and for how long?</h1>
<!--         <script>
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.querySelector('h1').textContent = "Phish setlists doesn't work on mobile - try desktop browser!";
            }
        </script> -->
        <img id="help-icon" src="images/Icon Help.png" alt="Help" title="WTF is this?">
        <span  id="subtitle">
            Colorcode Songs by
            <select id="selectButton">
            </select>
        </span>
        <div id="search-container">
            <input id="song-search" type="text" placeholder="Search songs...">
            <div id="search-results"></div>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" class="modal">
        <div class="modal-content">
            <span id="modal-close">&times;</span>
            <img id="modal-image" src="images/Phish How To (1).jpg" alt="Help">
            <div class="modal-nav">
                <button id="prev-slide">&larr;</button>
                <span id="slide-counter">1 / 5</span>
                <button id="next-slide">&rarr;</button>
            </div>
        </div>
    </div>
    <p></p>
    <div class='tooltip-donut'></div>
    <div id="sticky-season-labels"></div>
    <div id="chart-wrapper">
        <div id="labels-container"></div>
        <div id="svg-container">
            <svg></svg>
            <div id="mobile-bottom-message">4.0 only on mobile for now. Switch to desktop to see all years, or drop me a line to suggest.</div>
        </div>
    </div>
    <div id="fixed-scrollbar">
        <div id="scrollbar-content"></div>
    </div>
    <div id="footer">All setlist data from <a href="https://phish.in" target="_blank">Phish.in</a>. Send comments &amp; questions to phish.barcode at gmail or <a href="https://github.com/jzemel/song_signature" target="_blank">github</a></div>
    <div id="info-icon">i</div>
    <div id="controls-fab">⚙</div>
    <div id="controls-panel">
        <div id="controls-panel-content">
            <span id="controls-panel-close">&times;</span>
            <label for="mobile-color-select">Color code</label>
            <select id="mobile-color-select">
                <option>Shows Since Played</option>
                <option>Song Age</option>
                <option>Likes</option>
                <option>None</option>
            </select>
            <label for="mobile-song-search">Highlight song</label>
            <input type="text" id="mobile-song-search" placeholder="Type song name">
            <div id="mobile-search-results"></div>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-scale@4" defer></script>
    <script src="index.js" defer></script>
</body>
</html>
